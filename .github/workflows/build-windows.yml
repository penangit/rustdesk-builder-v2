###############################################################################
#  RustDesk Custom Client Builder — Windows x86_64 (64-bit) ONLY
#  Config: configs/RustDesk.json  (loaded via scripts/load-config.py)
#
#  • Manual dispatch only (no cron) — for isolated per-platform testing.
#  • Mirrors build-linux.yml structure exactly.
#  • This is the FLUTTER build path (64-bit).
#
#  NOTE ON 32-BIT: RustDesk's 32-bit Windows client uses the *Sciter* UI,
#  not Flutter (Flutter's Windows engine is 64-bit only). That needs a
#  SEPARATE workflow (target i686-pc-windows-msvc, x86-windows-static,
#  32-bit LLVM). This file does NOT build 32-bit. Outputs are named
#  ...-x86_64.exe / ...-x86_64.msi so the download page can tell them apart
#  from a future ...-i686.* 32-bit build.
###############################################################################
name: "🪟 Build Windows (64-bit)"
run-name: "🪟 Windows 64-bit · ${{ inputs.rustdesk_version || 'latest' }}"

on:
  workflow_dispatch:
    inputs:
      rustdesk_version:
        description: "Version to build (e.g. 1.4.9). Blank = latest."
        required: false
        default: ""
      force_build:
        description: "Build even if release exists (keep 'true' to add Windows to an already-built version)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

  workflow_call:
    inputs:
      rustdesk_version:
        required: false
        type: string
        default: ""
      force_build:
        required: false
        type: string
        default: "true"

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  LLVM_VERSION: "15.0.6"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  CONFIG_PATH: configs/RustDesk.json
  # optional Windows code-signing (leave unset to ship unsigned installers)
  WINDOWS_PFX_BASE64: "${{ secrets.WINDOWS_PFX_BASE64 }}"

jobs:
  # ─────────────────────────────────────────────────────────────────
  detect-version:
    name: "🔍 Detect version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: resolve
        run: |
          MANUAL="${{ inputs.rustdesk_version }}"
          FORCE="${{ inputs.force_build }}"
          if [ -n "$MANUAL" ]; then
            echo "version=$MANUAL" >> $GITHUB_OUTPUT
            if [ "$FORCE" = "true" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              if gh release view "v${MANUAL}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
                echo "::notice::Release v${MANUAL} already exists. Use force_build to rebuild."
                echo "should_build=false" >> $GITHUB_OUTPUT
              else
                echo "should_build=true" >> $GITHUB_OUTPUT
              fi
            fi
            exit 0
          fi
          LATEST=$(curl -sf "https://api.github.com/repos/rustdesk/rustdesk/releases/latest" \
            | jq -r '.tag_name // empty' | sed 's/^v//')
          if [ -z "$LATEST" ]; then
            LATEST=$(curl -sf "https://api.github.com/repos/rustdesk/rustdesk/tags?per_page=1" \
              | jq -r '.[0].name // empty' | sed 's/^v//')
          fi
          if [ -z "$LATEST" ]; then
            echo "::error::Could not determine latest RustDesk version"
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "::notice::Latest upstream version: $LATEST"
          if [ "$FORCE" = "true" ]; then
            echo "version=$LATEST" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif gh release view "v${LATEST}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::notice::Already built v${LATEST} — skipping"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "version=$LATEST" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────
  generate-bridge:
    name: "🌉 Generate bridge"
    needs: detect-version
    if: needs.detect-version.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.detect-version.outputs.version }}
    steps:
      - name: Checkout RustDesk source
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc git g++ libclang-dev \
            libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge

      - name: Install Flutter (bridge version)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install bridge codegen
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          pushd flutter
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml
          flutter pub get
          popd

      - name: Run flutter_rust_bridge_codegen
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  # ─────────────────────────────────────────────────────────────────
  build-windows:
    name: "🪟 Build Windows x86_64"
    needs: [detect-version, generate-bridge]
    if: needs.detect-version.outputs.should_build == 'true'
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.detect-version.outputs.version }}
    steps:
      # ── Step 1: checkout our repo to builder/ ──
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Export vcpkg cache variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Load config
        shell: bash
        run: python3 builder/scripts/load-config.py "builder/${{ env.CONFIG_PATH }}" >> $GITHUB_ENV

      # Avoid CRLF conversion so `git apply` of the .diff patches works on Windows
      - name: Configure git (LF)
        run: git config --global core.autocrlf false

      - name: Install ImageMagick
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      # ── Step 2: checkout RustDesk source to rustdesk/ ──
      - name: Checkout RustDesk source
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive
          path: rustdesk

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./rustdesk/

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace Flutter engine (rustdesk custom)
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch Flutter dropdown
        shell: bash
        run: |
          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          cp builder/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_DIR/"
          cd "$FLUTTER_DIR"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff || echo "Flutter patch already applied or N/A"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "windows-x64"
          workspaces: "rustdesk -> target"

      # ── Step 3: vcpkg — run from rustdesk/ where vcpkg.json lives ──
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          vcpkgJsonGlob: "rustdesk/vcpkg.json"
          doNotCache: false

      - name: Install vcpkg dependencies
        working-directory: rustdesk
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true

      # ── Step 4: apply all customizations ──
      - name: Apply customizations
        working-directory: rustdesk
        shell: bash
        run: |
          echo "::group::Server + Key + API"
          sed -i "s|rs-ny.rustdesk.com|${{ env.CUSTOM_SERVER }}|" ./libs/hbb_common/src/config.rs 2>/dev/null || true
          sed -i "s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${{ env.CUSTOM_KEY }}|" ./libs/hbb_common/src/config.rs 2>/dev/null || true
          sed -i "s|https://admin.rustdesk.com|${{ env.CUSTOM_API_SERVER }}|" ./src/common.rs
          echo "::endgroup::"

          echo "::group::Allow custom.txt (bypass signature check)"
          python3 ../builder/.github/patches/allowCustom.py
          git apply ../builder/.github/patches/removeSetupServerTip.diff || echo "removeSetupServerTip patch N/A"
          echo "::endgroup::"

          echo "::group::App name"
          if [ "${{ env.CUSTOM_APPNAME }}" != "rustdesk" ] && [ "${{ env.CUSTOM_APPNAME }}" != "RustDesk" ]; then
            find ./src/lang -name "*.rs" -exec sed -i "s|RustDesk|${{ env.CUSTOM_APPNAME }}|" {} \;
            sed -i "s|description = \"RustDesk Remote Desktop\"|description = \"${{ env.CUSTOM_APPNAME }}\"|" ./Cargo.toml || true
            sed -i "s|\"RustDesk Remote Desktop\"|\"${{ env.CUSTOM_APPNAME }}\"|" ./flutter/windows/runner/Runner.rc || true
            sed -i "s|VALUE \"InternalName\", \"rustdesk\"|VALUE \"InternalName\", \"${{ env.CUSTOM_APPNAME }}\"|" ./flutter/windows/runner/Runner.rc || true
          fi
          echo "::endgroup::"

          echo "::group::Company name"
          if [ -n "${{ env.CUSTOM_COMPNAME }}" ] && [ "${{ env.CUSTOM_COMPNAME }}" != "Purslane Ltd" ]; then
            sed -i "s|Purslane Tech Pte. Ltd.|${{ env.CUSTOM_COMPNAME }}|g" ./Cargo.toml ./libs/portable/Cargo.toml ./src/main.rs \
              ./flutter/lib/desktop/pages/desktop_setting_page.dart ./flutter/windows/runner/Runner.rc ./res/msi/preprocess.py 2>/dev/null || true
            sed -i "s|Purslane Ltd|${{ env.CUSTOM_COMPNAME }}|g" ./Cargo.toml ./libs/portable/Cargo.toml ./src/main.rs \
              ./flutter/lib/desktop/pages/desktop_setting_page.dart ./flutter/windows/runner/Runner.rc ./res/msi/preprocess.py 2>/dev/null || true
            sed -i "s|PURSLANE|${{ env.CUSTOM_COMPNAME }}|g" ./res/msi/preprocess.py 2>/dev/null || true
            find ./src/lang -name "*.rs" -exec sed -i '/powered_by_me/s|RustDesk|${{ env.CUSTOM_COMPNAME }}|g' {} \; 2>/dev/null || true
          fi
          echo "::endgroup::"

          echo "::group::Feature flags"
          [ "${{ env.CUSTOM_DELAY_FIX }}" == "true" ] && sed -i 's|!key.is_empty()|false|' ./src/client.rs && echo "  delay fix applied" || true
          [ "${{ env.CUSTOM_X_OFFLINE }}" == "true" ] && git apply ../builder/.github/patches/xoffline.diff && echo "  xOffline applied" || true
          [ "${{ env.CUSTOM_HIDE_CM }}" == "true" ] && git apply ../builder/.github/patches/hidecm.diff && echo "  hidecm applied" || true
          if [ "${{ env.CUSTOM_REMOVE_NEW_VERSION_NOTIF }}" == "true" ]; then
            sed -i 's|updateUrl.isNotEmpty|false|' ./flutter/lib/desktop/pages/desktop_home_page.dart
            echo "  removeNewVersionNotif applied"
          fi
          echo "::endgroup::"

          echo "::group::Fix flutter_gpu_texture_renderer (needed for tagged releases)"
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock 2>/dev/null || true
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml 2>/dev/null || true
          echo "::endgroup::"

          echo "::group::URL links"
          if [ -n "${{ env.CUSTOM_URL_LINK }}" ] && [ "${{ env.CUSTOM_URL_LINK }}" != "https://rustdesk.com" ]; then
            sed -i "s|https://rustdesk.com|${{ env.CUSTOM_URL_LINK }}|g" ./flutter/lib/common.dart \
              ./flutter/lib/desktop/pages/desktop_setting_page.dart \
              ./flutter/lib/mobile/pages/settings_page.dart 2>/dev/null || true
          fi
          if [ -n "${{ env.CUSTOM_DOWNLOAD_LINK }}" ] && [ "${{ env.CUSTOM_DOWNLOAD_LINK }}" != "https://rustdesk.com/download" ]; then
            sed -i "s|https://rustdesk.com/download|${{ env.CUSTOM_DOWNLOAD_LINK }}|g" \
              ./flutter/lib/desktop/pages/desktop_home_page.dart \
              ./flutter/lib/mobile/pages/connection_page.dart 2>/dev/null || true
          fi
          echo "::endgroup::"

      # ── Step 5: build (Flutter x64) ──
      - name: Build RustDesk
        working-directory: rustdesk
        shell: bash
        run: |
          python3 ./build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: Inject custom_.txt
        working-directory: rustdesk
        shell: bash
        run: echo -n '${{ env.CUSTOM_B64 }}' > ./rustdesk/custom_.txt

      - name: Build self-extracting EXE (portable)
        working-directory: rustdesk
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/rustdesk.exe"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/${{ env.CUSTOM_FILENAME }}-${{ env.VERSION }}-x86_64.exe"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build MSI
        working-directory: rustdesk
        continue-on-error: true
        run: |
          $appNs = "${{ env.CUSTOM_FILENAME }}" -replace '\s','_'
          Copy-Item "./rustdesk/${{ env.CUSTOM_FILENAME }}.exe" "./rustdesk/$appNs.exe" -ErrorAction SilentlyContinue
          pushd ./res/msi
          python preprocess.py --app-name "$appNs" --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          Copy-Item ./Package/bin/x64/Release/en-us/Package.msi "../../SignOutput/${{ env.CUSTOM_FILENAME }}-${{ env.VERSION }}-x86_64.msi"
          popd

      - name: Sign EXE + MSI (optional — only if WINDOWS_PFX_BASE64 secret is set)
        if: env.WINDOWS_PFX_BASE64 != ''
        working-directory: rustdesk
        shell: pwsh
        env:
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          Get-ChildItem ./SignOutput -Recurse -Include *.exe,*.msi | ForEach-Object {
            Write-Host "Signing $($_.Name)"
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }
          Remove-Item $pfx -Force

      - name: List outputs
        working-directory: rustdesk
        shell: bash
        run: ls -lh ./SignOutput/ || echo "No outputs!"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-${{ env.VERSION }}
          path: ./rustdesk/SignOutput/*
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  create-release:
    name: "📦 Release"
    needs: [detect-version, build-windows]
    if: |
      always() &&
      needs.detect-version.outputs.should_build == 'true' &&
      needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.detect-version.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false
      - name: Flatten assets
        run: |
          mkdir -p final-assets
          find release-assets -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp {} final-assets/ \;
          echo "=== Release assets ==="
          ls -lh final-assets/
      # No `body:` here on purpose — this ADDS the Windows files to the existing
      # v<version> release without overwriting notes another workflow may have set.
      - name: Add Windows build to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "RustDesk v${{ env.VERSION }} — Custom Build"
          files: final-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────
  update-pages:
    name: "🌐 Update download page"
    needs: [detect-version, create-release]
    if: needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.detect-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update versions list
        run: |
          echo "${{ env.VERSION }}" >> docs/versions.txt
          sort -Vru docs/versions.txt -o docs/versions.txt
          cat docs/versions.txt
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/versions.txt
          git diff --cached --quiet || git commit -m "📦 Built v${{ env.VERSION }} (Windows x64)"
          git push
