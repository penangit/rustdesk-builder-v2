<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RustDesk — Neo+ Remote</title>
<style>
  :root {
    --bg:        #0c0e12;
    --surface:   #151921;
    --border:    #1f2937;
    --text:      #e2e8f0;
    --muted:     #8896ab;
    --accent:    #3b82f6;
    --accent-h:  #60a5fa;
    --green:     #22c55e;
    --amber:     #f59e0b;
    --red:       #ef4444;
    --radius:    10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-h); }

  /* ── Header ── */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
  }
  .header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.25rem;
  }
  .header h1 span { color: var(--accent); }
  .header p { color: var(--muted); font-size: 0.875rem; }

  /* ── Server badge ── */
  .server-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.35rem 1rem;
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.75rem;
  }
  .server-badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Main container ── */
  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 1.5rem;
  }

  /* ── Loading / Error ── */
  .state-msg {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .state-msg .spinner {
    display: inline-block;
    width: 24px; height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-bottom: 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Release card ── */
  .release {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    transition: border-color 0.15s;
  }
  .release:hover { border-color: #2d3748; }
  .release.latest { border-color: var(--accent); }
  .release-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .release-head h2 {
    font-size: 1.1rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .tag {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.2rem 0.55rem;
    border-radius: 4px;
    display: inline-block;
  }
  .tag-latest { background: rgba(59,130,246,0.15); color: var(--accent); }
  .tag-date   { color: var(--muted); font-size: 0.8rem; font-weight: 400; }

  /* ── Download grid ── */
  .downloads {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
    gap: 0.5rem;
  }
  .dl-btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 0.9rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 0.82rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    text-decoration: none;
  }
  .dl-btn:hover {
    background: rgba(255,255,255,0.04);
    border-color: var(--accent);
    color: var(--text);
  }
  .dl-btn .icon { font-size: 1.1rem; flex-shrink: 0; }
  .dl-btn .meta {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.3;
  }
  .dl-btn .meta .label { font-weight: 500; }
  .dl-btn .meta .size  { font-size: 0.7rem; color: var(--muted); }
  .dl-btn.missing {
    opacity: 0.35;
    pointer-events: none;
    border-style: dashed;
  }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--muted);
    font-size: 0.75rem;
    border-top: 1px solid var(--border);
    margin-top: 2rem;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .downloads { grid-template-columns: 1fr 1fr; }
    .release { padding: 1rem; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🖥️ <span>RustDesk</span> — Neo+ Remote</h1>
  <p>Pre-configured custom builds · auto-built from upstream releases</p>
  <div class="server-badge">
    <span class="dot"></span>
    ir.remote-neo.com
  </div>
</div>

<div class="container">
  <div id="releases" class="state-msg">
    <div class="spinner"></div><br>
    Loading releases…
  </div>
</div>

<div class="footer">
  Built by <strong>penangit</strong> · Automated with GitHub Actions<br>
  Clients connect to <code>ir.remote-neo.com</code> · Password + click approval
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────
const REPO  = 'penangit/rustdesk-builder-v2';
const API   = `https://api.github.com/repos/${REPO}/releases`;

// Map file extension / pattern → platform card
const PLATFORMS = [
  { label: 'Windows EXE',      icon: '🪟', match: f => /\.exe$/i.test(f.name) },
  { label: 'Windows MSI',      icon: '📦', match: f => /\.msi$/i.test(f.name) },
  { label: 'Android arm64',    icon: '📱', match: f => /aarch64.*\.apk$/i.test(f.name) },
  { label: 'Android armv7',    icon: '📱', match: f => /armv7.*\.apk$/i.test(f.name) },
  { label: 'Android x86_64',   icon: '📱', match: f => /x86_64.*\.apk$/i.test(f.name) },
  { label: 'Linux .deb',       icon: '🐧', match: f => /\.deb$/i.test(f.name) },
  { label: 'Linux .rpm',       icon: '🐧', match: f => /\.rpm$/i.test(f.name) && !/suse/i.test(f.name) },
  { label: 'Linux AppImage',   icon: '🐧', match: f => /\.appimage$/i.test(f.name) },
  { label: 'macOS DMG',        icon: '🍎', match: f => /\.dmg$/i.test(f.name) },
];

function formatSize(bytes) {
  if (!bytes) return '';
  const mb = bytes / (1024 * 1024);
  return mb >= 1 ? `${mb.toFixed(1)} MB` : `${(bytes / 1024).toFixed(0)} KB`;
}

function relativeDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const days = Math.floor((now - d) / 86400000);
  if (days === 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 30) return `${days}d ago`;
  return d.toLocaleDateString('en-MY', { day: 'numeric', month: 'short', year: 'numeric' });
}

function renderRelease(rel, isLatest) {
  const version = rel.tag_name.replace(/^v/, '');
  const assets  = rel.assets || [];

  let html = `
    <div class="release${isLatest ? ' latest' : ''}">
      <div class="release-head">
        <h2>
          v${version}
          ${isLatest ? '<span class="tag tag-latest">Latest</span>' : ''}
        </h2>
        <span class="tag-date">${relativeDate(rel.published_at || rel.created_at)}</span>
      </div>
      <div class="downloads">`;

  for (const plat of PLATFORMS) {
    const match = assets.find(a => plat.match(a));
    if (match) {
      html += `
        <a class="dl-btn" href="${match.browser_download_url}" title="${match.name}">
          <span class="icon">${plat.icon}</span>
          <span class="meta">
            <span class="label">${plat.label}</span>
            <span class="size">${formatSize(match.size)}</span>
          </span>
        </a>`;
    } else {
      html += `
        <span class="dl-btn missing">
          <span class="icon">${plat.icon}</span>
          <span class="meta">
            <span class="label">${plat.label}</span>
            <span class="size">not built</span>
          </span>
        </span>`;
    }
  }

  html += `</div></div>`;
  return html;
}

// ── Fetch & Render ──────────────────────────────────────────────────────
async function loadReleases() {
  const el = document.getElementById('releases');
  try {
    const res = await fetch(API, { headers: { Accept: 'application/vnd.github+json' } });
    if (!res.ok) throw new Error(`GitHub API ${res.status}`);
    const data = await res.json();

    if (!data.length) {
      el.innerHTML = '<div class="state-msg">No releases yet. Trigger a build from GitHub Actions.</div>';
      return;
    }

    el.innerHTML = data.map((r, i) => renderRelease(r, i === 0)).join('');
  } catch (err) {
    el.innerHTML = `<div class="state-msg">⚠️ Could not load releases.<br><small>${err.message}</small></div>`;
  }
}

loadReleases();
// Auto-refresh every 5 minutes
setInterval(loadReleases, 300000);
</script>
</body>
</html>
