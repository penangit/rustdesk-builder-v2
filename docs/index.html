<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RustDesk — Neo+ Remote</title>
<style>
  :root {
    --bg:        #0c0e12;
    --surface:   #151921;
    --surface-2: #1a2029;
    --border:    #1f2937;
    --text:      #e2e8f0;
    --muted:     #8896ab;
    --accent:    #3b82f6;
    --accent-h:  #60a5fa;
    --green:     #22c55e;
    --amber:     #f59e0b;
    --red:       #ef4444;
    --radius:    10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-h); }

  /* ── Header ── */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
  }
  .header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
  .header h1 span { color: var(--accent); }
  .header p { color: var(--muted); font-size: 0.875rem; }

  /* ── Server badge ── */
  .server-badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 0.35rem 1rem;
    font-size: 0.8rem; color: var(--muted); margin-top: 0.75rem;
  }
  .server-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ── Main container ── */
  .container { max-width: 820px; margin: 0 auto; padding: 1.5rem; }

  /* ── Loading / Error ── */
  .state-msg { text-align: center; padding: 4rem 1rem; color: var(--muted); font-size: 0.95rem; }
  .state-msg .spinner {
    display: inline-block; width: 24px; height: 24px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Release accordion ── */
  .release {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 0.75rem;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .release.latest { border-color: var(--accent); }

  .release-head {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 1rem 1.25rem; cursor: pointer; user-select: none;
    transition: background 0.12s;
  }
  .release-head:hover { background: var(--surface-2); }
  .release-head .ver { font-size: 1.05rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
  .release-head .spacer { flex: 1; }

  .chev { width: 15px; height: 15px; flex-shrink: 0; color: var(--muted); transition: transform 0.2s; }
  .release.open .chev { transform: rotate(90deg); }

  .tag { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.18rem 0.5rem; border-radius: 4px; }
  .tag-latest { background: rgba(59,130,246,0.15); color: var(--accent); }

  .count { font-size: 0.76rem; color: var(--muted); white-space: nowrap; }
  .count b { color: var(--text); font-weight: 600; }
  .count.none b { color: var(--muted); }
  .date  { font-size: 0.76rem; color: var(--muted); white-space: nowrap; }

  .release-body { display: none; padding: 0.25rem 1.25rem 1.25rem; }
  .release.open .release-body { display: block; }

  /* ── Platform groups ── */
  .group { margin-top: 1.1rem; }
  .group-title {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted); font-weight: 700;
    padding-bottom: 0.4rem; margin-bottom: 0.55rem;
    border-bottom: 1px solid var(--border);
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.5rem; }

  .dl-btn {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.6rem 0.85rem; border-radius: 8px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text); font-size: 0.82rem; cursor: pointer;
    transition: background 0.15s, border-color 0.15s; text-decoration: none;
  }
  .dl-btn:hover { background: rgba(255,255,255,0.04); border-color: var(--accent); color: var(--text); }
  .dl-btn .icon { font-size: 1.05rem; flex-shrink: 0; }
  .dl-btn .meta { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }
  .dl-btn .meta .label { font-weight: 500; }
  .dl-btn .meta .size  { font-size: 0.7rem; color: var(--muted); }
  .dl-btn.missing { opacity: 0.32; pointer-events: none; border-style: dashed; }

  /* ── Build-in-progress banner ── */
  .build-banner {
    display: none; align-items: center; gap: 0.6rem;
    max-width: 820px; margin: 1.25rem auto -0.25rem; padding: 0.7rem 1rem;
    background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.35);
    border-radius: var(--radius); color: var(--amber); font-size: 0.83rem;
  }
  .build-banner.show { display: flex; }
  .build-banner .bspin {
    width: 14px; height: 14px; flex-shrink: 0;
    border: 2px solid rgba(245,158,11,0.3); border-top-color: var(--amber);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  .build-banner b { color: #fbbf24; font-weight: 600; }
  .build-banner a { color: #fbbf24; text-decoration: underline; }

  /* ── Changelog ── */
  .changelog { margin-top: 1.15rem; border-top: 1px solid var(--border); padding-top: 0.9rem; }
  .cl-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; margin-bottom: 0.5rem; }
  .cl-loading { color: var(--muted); font-size: 0.82rem; padding: 0.2rem 0; }
  .changelog .cl-h { font-size: 0.88rem; font-weight: 600; margin: 0.75rem 0 0.3rem; color: var(--text); }
  .changelog .cl-ul { margin: 0.15rem 0 0.55rem 1.15rem; }
  .changelog .cl-ul li { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.15rem; }
  .changelog p { font-size: 0.82rem; color: var(--muted); margin: 0.28rem 0; }
  .changelog code { background: var(--surface-2); padding: 0.05rem 0.3rem; border-radius: 4px; font-size: 0.78rem; }
  .cl-src { margin-top: 0.7rem; font-size: 0.72rem; color: var(--muted); }

  /* ── Footer ── */
  .footer { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 0.75rem; border-top: 1px solid var(--border); margin-top: 2rem; }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr 1fr; }
    .release-head { padding: 0.85rem 1rem; gap: 0.5rem; }
    .release-body { padding: 0.25rem 1rem 1rem; }
    .date { display: none; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🖥️ <span>RustDesk</span> — Neo+ Remote</h1>
  <p>Pre-configured custom builds · auto-built from upstream releases</p>
  <div class="server-badge">
    <span class="dot"></span>
    ir.remote-neo.com
  </div>
</div>

<div class="build-banner" id="buildBanner"></div>

<div class="container">
  <div id="releases">
    <div class="state-msg"><div class="spinner"></div><br>Loading releases…</div>
  </div>
</div>

<div class="footer">
  Built by <strong>penangit</strong> · Automated with GitHub Actions<br>
  Clients connect to <code>ir.remote-neo.com</code> · Password + click approval
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────
const REPO = 'penangit/rustdesk-builder-v2';
const API  = `https://api.github.com/repos/${REPO}/releases`;

// Platform groups → each item matches a release asset by filename.
// Arch tokens are chosen so they never collide:
//   x86_64  (64-bit)  vs  i686 (32-bit)   — neither is a substring of the other.
// The extension anchor ($) keeps e.g. an Android x86_64 .apk out of the
// Windows/Linux x86_64 slots. Expected filenames the workflows produce:
//   Windows : RustDesk-x86_64.exe / .msi   |   RustDesk-i686.exe / .msi
//   Android : RustDesk-aarch64.apk / RustDesk-armv7.apk / RustDesk-x86_64.apk
//   Linux   : RustDesk-{x86_64,aarch64}.{deb,rpm}  (Fedora rpm has NO 'suse')
//             RustDesk-suse-{x86_64,aarch64}.rpm   (openSUSE)
//             RustDesk-{x86_64,aarch64}.{AppImage,flatpak}
//             RustDesk-x86_64.pkg.tar.zst          (Arch, x86_64 only)
//   macOS   : RustDesk-x86_64.dmg
const GROUPS = [
  { name: 'Windows', items: [
    { label: '64-bit EXE', icon: '🪟', match: n => /x86_64.*\.exe$/i.test(n) },
    { label: '64-bit MSI', icon: '📦', match: n => /x86_64.*\.msi$/i.test(n) },
    { label: '32-bit EXE', icon: '🪟', match: n => /i686.*\.exe$/i.test(n) },
    { label: '32-bit MSI', icon: '📦', match: n => /i686.*\.msi$/i.test(n) },
  ]},
  { name: 'Android', items: [
    { label: 'arm64 (aarch64)', icon: '📱', match: n => /aarch64.*\.apk$/i.test(n) },
    { label: 'armv7',           icon: '📱', match: n => /armv7.*\.apk$/i.test(n) },
    { label: 'x86_64',          icon: '📱', match: n => /x86_64.*\.apk$/i.test(n) },
  ]},
  { name: 'Linux', items: [
    { label: 'x86_64 · .deb',        icon: '🐧', match: n => /x86_64.*\.deb$/i.test(n) },
    { label: 'arm64 · .deb',         icon: '🐧', match: n => /aarch64.*\.deb$/i.test(n) },
    { label: 'x86_64 · .rpm',        icon: '🐧', match: n => /x86_64.*\.rpm$/i.test(n) && !/suse/i.test(n) },
    { label: 'arm64 · .rpm',         icon: '🐧', match: n => /aarch64.*\.rpm$/i.test(n) && !/suse/i.test(n) },
    { label: 'x86_64 · .rpm (SUSE)', icon: '🦎', match: n => /suse.*x86_64.*\.rpm$/i.test(n) },
    { label: 'arm64 · .rpm (SUSE)',  icon: '🦎', match: n => /suse.*aarch64.*\.rpm$/i.test(n) },
    { label: 'x86_64 · AppImage',    icon: '📦', match: n => /x86_64.*\.appimage$/i.test(n) },
    { label: 'arm64 · AppImage',     icon: '📦', match: n => /aarch64.*\.appimage$/i.test(n) },
    { label: 'x86_64 · flatpak',     icon: '📦', match: n => /x86_64.*\.flatpak$/i.test(n) },
    { label: 'arm64 · flatpak',      icon: '📦', match: n => /aarch64.*\.flatpak$/i.test(n) },
    { label: 'x86_64 · Arch (zst)',  icon: '🏛️', match: n => /x86_64.*\.pkg\.tar\.zst$/i.test(n) },
  ]},
  { name: 'macOS', items: [
    { label: 'DMG', icon: '🍎', match: n => /\.dmg$/i.test(n) },
  ]},
];
const TOTAL_VARIANTS = GROUPS.reduce((a, g) => a + g.items.length, 0);

// Remember which versions the user has expanded, so a background refresh
// doesn't collapse them. Latest auto-opens once on first load.
const openState = new Set();
let firstLoad = true;

const CHEV = '<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>';

function formatSize(bytes) {
  if (!bytes) return '';
  const mb = bytes / (1024 * 1024);
  return mb >= 1 ? `${mb.toFixed(1)} MB` : `${(bytes / 1024).toFixed(0)} KB`;
}

function relativeDate(iso) {
  const d = new Date(iso), now = new Date();
  const days = Math.floor((now - d) / 86400000);
  if (days === 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 30) return `${days}d ago`;
  return d.toLocaleDateString('en-MY', { day: 'numeric', month: 'short', year: 'numeric' });
}

function renderRelease(rel, isLatest) {
  const version = rel.tag_name.replace(/^v/, '');
  const assets  = rel.assets || [];
  const names   = assets.map(a => a.name);
  const built   = GROUPS.reduce((a, g) => a + g.items.filter(it => names.some(nm => it.match(nm))).length, 0);
  const isOpen  = openState.has(version);

  let groupsHtml = '';
  for (const g of GROUPS) {
    let cells = '';
    for (const it of g.items) {
      const asset = assets.find(a => it.match(a.name));
      if (asset) {
        cells += `
          <a class="dl-btn" href="${asset.browser_download_url}" title="${asset.name}">
            <span class="icon">${it.icon}</span>
            <span class="meta"><span class="label">${it.label}</span><span class="size">${formatSize(asset.size)}</span></span>
          </a>`;
      } else {
        cells += `
          <span class="dl-btn missing">
            <span class="icon">${it.icon}</span>
            <span class="meta"><span class="label">${it.label}</span><span class="size">not built</span></span>
          </span>`;
      }
    }
    groupsHtml += `<div class="group"><div class="group-title">${g.name}</div><div class="grid">${cells}</div></div>`;
  }

  return `
    <div class="release${isLatest ? ' latest' : ''}${isOpen ? ' open' : ''}" data-ver="${version}">
      <div class="release-head" onclick="toggleRelease('${version}')">
        ${CHEV}
        <span class="ver">v${version}${isLatest ? ' <span class="tag tag-latest">Latest</span>' : ''}</span>
        <span class="spacer"></span>
        <span class="count${built === 0 ? ' none' : ''}"><b>${built}</b> / ${TOTAL_VARIANTS} builds</span>
        <span class="date">${relativeDate(rel.published_at || rel.created_at)}</span>
      </div>
      <div class="release-body">${groupsHtml}<div class="changelog" data-cl="${version}"></div></div>
    </div>`;
}

function toggleRelease(version) {
  const opening = !openState.has(version);
  if (opening) openState.add(version); else openState.delete(version);
  const card = document.querySelector(`.release[data-ver="${version}"]`);
  if (!card) return;
  card.classList.toggle('open');
  if (opening) {
    const cl = card.querySelector('.changelog');
    if (cl) loadChangelog(version, cl);
  }
}

// ── Minimal, HTML-safe Markdown renderer (headers / lists / links / code) ──
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inlineMd(s) {
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|\s)(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return s;
}
// Changelog section keywords rendered as headers even without a markdown '###'.
const SECTION_WORDS = /^(Added|Changed|Changes?|Fixed|Fixes?|Removed|Remove|Deprecated|Security|Performance|Improvements?|New|Notes?|Breaking(?: Changes?)?|Features?)$/i;
// RustDesk wraps notes in <details><summary>Changelog</summary>…</details>, preceded
// by a download table that links to rustdesk's OWN binaries — keep ONLY the changelog.
function extractChangelog(body) {
  let m = body.match(/<summary>\s*Changelog\s*<\/summary>([\s\S]*?)<\/details>/i);
  if (m) return m[1].trim();
  m = body.match(/(?:^|\n)#{0,6}\s*Changelog\s*\n([\s\S]*)$/i);
  if (m) return m[1].replace(/<\/?(?:details|summary)[^>]*>/gi, '').trim();
  // Fallback: drop tables / shield badges / promo lines, keep the rest.
  return body.split(/\r?\n/).filter(l =>
    !/^\s*\|/.test(l) && !/^\s*\[!\[/.test(l) &&
    !/^For more downloads/i.test(l) && !/^For the latest features/i.test(l)
  ).join('\n').replace(/<\/?(?:details|summary)[^>]*>/gi, '').trim();
}
function mdToHtml(md) {
  const lines = escapeHtml(md).split(/\r?\n/);
  let html = '', inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    if (!line.trim()) { closeList(); continue; }
    let m;
    if ((m = line.match(/^#{1,6}\s+(.*)$/)))      { closeList(); html += `<h4 class="cl-h">${inlineMd(m[1])}</h4>`; }
    else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { if (!inList) { html += '<ul class="cl-ul">'; inList = true; } html += `<li>${inlineMd(m[1])}</li>`; }
    else if (SECTION_WORDS.test(line.trim()))     { closeList(); html += `<h4 class="cl-h">${line.trim()}</h4>`; }
    else                                          { closeList(); html += `<p>${inlineMd(line)}</p>`; }
  }
  closeList();
  return html;
}

// ── Lazy-load upstream changelog per version (cached) ──
const changelogCache = {}; // version -> html | 'loading' | 'error'
async function loadChangelog(version, container) {
  const cached = changelogCache[version];
  if (cached === 'loading') return;
  if (cached && cached !== 'error') { container.innerHTML = cached; return; }
  changelogCache[version] = 'loading';
  container.innerHTML = '<div class="cl-loading">Loading changelog…</div>';
  let body = '';
  for (const tag of [version, 'v' + version]) {
    try {
      const r = await fetch(`https://api.github.com/repos/rustdesk/rustdesk/releases/tags/${tag}`,
        { headers: { Accept: 'application/vnd.github+json' } });
      if (r.ok) { const j = await r.json(); body = (j.body || '').trim(); if (body) break; }
    } catch (_) {}
  }
  if (body) {
    const html = `<div class="cl-title">Changelog — RustDesk v${version}</div>` + mdToHtml(extractChangelog(body)) +
      `<div class="cl-src">Mirrored from <a href="https://github.com/rustdesk/rustdesk/releases/tag/${version}" target="_blank" rel="noopener">rustdesk/rustdesk ↗</a></div>`;
    changelogCache[version] = html;
    container.innerHTML = html;
  } else {
    changelogCache[version] = 'error';
    container.innerHTML = '<div class="cl-loading">Changelog unavailable.</div>';
  }
}

// ── Build-in-progress banner (polls the Actions runs API) ──
const RUNS_API = `https://api.github.com/repos/${REPO}/actions/runs?per_page=20`;
let wasBuilding = false;
async function checkBuilds() {
  const banner = document.getElementById('buildBanner');
  try {
    const res = await fetch(RUNS_API, { headers: { Accept: 'application/vnd.github+json' } });
    if (!res.ok) throw new Error();
    const runs = (await res.json()).workflow_runs || [];
    const active = runs.filter(r => r.status === 'in_progress' || r.status === 'queued');
    if (active.length) {
      const names = [...new Set(active.map(r => r.name))].join(', ');
      banner.innerHTML = `<span class="bspin"></span><span><b>Build in progress</b> — ${names} · <a href="${active[0].html_url}" target="_blank" rel="noopener">view run ↗</a></span>`;
      banner.classList.add('show');
      return true;
    }
    banner.classList.remove('show');
    return false;
  } catch (_) { banner.classList.remove('show'); return false; }
}
async function pollBuilds() {
  const building = await checkBuilds();
  if (wasBuilding && !building) loadReleases(); // a build just finished → pull fresh assets
  wasBuilding = building;
}

// ── Fetch & Render ──────────────────────────────────────────────────────
async function loadReleases() {
  const el = document.getElementById('releases');
  try {
    const res = await fetch(API, { headers: { Accept: 'application/vnd.github+json' } });
    if (!res.ok) throw new Error(`GitHub API ${res.status}`);
    const data = await res.json();

    if (!data.length) {
      el.innerHTML = '<div class="state-msg">No releases yet. Trigger a build from GitHub Actions.</div>';
      return;
    }

    if (firstLoad) {
      openState.add(data[0].tag_name.replace(/^v/, '')); // expand latest once
      firstLoad = false;
    }

    el.innerHTML = data.map((r, i) => renderRelease(r, i === 0)).join('');

    // Re-populate changelogs for any expanded cards (cached → instant).
    openState.forEach(v => {
      const card = document.querySelector(`.release[data-ver="${v}"]`);
      if (card) { const cl = card.querySelector('.changelog'); if (cl) loadChangelog(v, cl); }
    });
  } catch (err) {
    el.innerHTML = `<div class="state-msg">⚠️ Could not load releases.<br><small>${err.message}</small></div>`;
  }
}

loadReleases();
pollBuilds();
setInterval(loadReleases, 300000); // releases: every 5 min
setInterval(pollBuilds,   120000); // build status: every 2 min
// (kept conservative — GitHub's unauthenticated API allows ~60 req/hr per IP)
</script>
</body>
</html>
